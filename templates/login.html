<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Vin Parking</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
  <main class="login-card">
    <div class="brand-icon">VP</div>
    <p class="eyebrow">SMART PARKING SYSTEM</p>
    <h1>Vin Parking</h1>
    <p class="muted">Đăng nhập để quản lý bãi đỗ xe</p>

    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>

    <p class="login-foot">Hệ thống quản lý bãi đỗ xe thông minh</p>
  </main>
</body>

</html>
